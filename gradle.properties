# Project-wide Gradle settings.
# JVM Configuration - Increased for native builds
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Build Performance Optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=4

# Kotlin Optimizations
kotlin.caching.enabled=true
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true

# Kotlin version compatibility
kotlin.stdlib.default.dependency=true

# Android Build Optimizations
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.suppressUnsupportedCompileSdk=34,35
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Build Cache Configuration - Using Gradle's built-in cache
# android.buildCacheDir=${projectDir}/.gradle/build-cache  # DEPRECATED - removed in AGP 7.0

# Honor X6c Specific - MediaTek Helio G81 Ultra optimizations
# android.enableSeparateAnnotationProcessing=true  # DEPRECATED - removed in AGP 4.0
# android.enableCompilePrediction=true  # Not available

# NDK Configuration
android.ndkVersion=25.2.9519653

# FunctionGemma Build Optimizations
# Enable R8 full mode for better code shrinking
android.enableR8.fullMode=true

# Build optimization flags for smaller APK
android.enableResourceOptimizations=true
android.enableApkSignerV2=true
android.enableApkSignerV3=true
android.enableApkSignerV4=true

# DEX optimization
android.dexOptimizer=dx
# android.enableDexingArtifactTransform=true  # DEPRECATED - removed in AGP 8.3

# Native build optimizations for llama.cpp
android.cmake.buildType=Release
android.cmake.arguments=-DANDROID_TOOLCHAIN=clang;-DANDROID_STL=c++_shared