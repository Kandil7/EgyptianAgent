# Project-wide Gradle settings.
# JVM Configuration - Increased for native builds
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Build Performance Optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=4

# Kotlin Optimizations
kotlin.caching.enabled=true
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true

# Android Build Optimizations
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.suppressUnsupportedCompileSdk=34
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Build Cache Configuration
android.buildCacheDir=${projectDir}/.gradle/build-cache

# Honor X6c Specific - MediaTek Helio G81 Ultra optimizations
android.enableSeparateAnnotationProcessing=true
android.enableCompilePrediction=true

# NDK Configuration
android.ndkVersion=25.2.9519653