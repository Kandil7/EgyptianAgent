// Task to create debug keystore if it doesn't exist
tasks.register('createDebugKeystore') {
    doLast {
        def keystoreDir = file('../keystore')
        if (!keystoreDir.exists()) {
            keystoreDir.mkdirs()
        }
        def keystoreFile = file('../keystore/debug.keystore')
        if (!keystoreFile.exists()) {
            println "Creating debug keystore..."
            exec {
                executable 'keytool'
                args '-genkey', '-v',
                     '-keystore', keystoreFile.absolutePath,
                     '-alias', 'androiddebugkey',
                     '-storepass', 'android',
                     '-keypass', 'android',
                     '-keyalg', 'RSA',
                     '-keysize', '2048',
                     '-validity', '10000',
                     '-dname', 'CN=Android Debug,O=Android,C=US'
            }
        }
    }
}

preBuild.dependsOn tasks.createDebugKeystore

// Task to generate build info
tasks.register('generateBuildInfo') {
    doLast {
        def buildInfoFile = file("$buildDir/intermediates/build_info.txt")
        buildInfoFile.parentFile.mkdirs()
        buildInfoFile.text = """
Build Information
=================
Version: ${android.defaultConfig.versionName}
Version Code: ${android.defaultConfig.versionCode}
Build Type: ${project.hasProperty('buildType') ? project.property('buildType') : 'unknown'}
Build Time: ${new Date()}
Git Commit: ${getGitCommit()}
Git Branch: ${getGitBranch()}
""".trim()
    }
}

// Helper functions for git info
ext.getGitCommit = { ->
    try {
        def process = "git rev-parse --short HEAD".execute()
        return process.text.trim()
    } catch (Exception e) {
        return "unknown"
    }
}

ext.getGitBranch = { ->
    try {
        def process = "git rev-parse --abbrev-ref HEAD".execute()
        return process.text.trim()
    } catch (Exception e) {
        return "unknown"
    }
}

// Task for system app deployment (requires root)
tasks.register('deployAsSystemApp') {
    description "Deploy APK as system app (requires rooted device)"
    group "deployment"
    dependsOn 'assembleRelease'

    doLast {
        def apkFile = file("$buildDir/outputs/apk/release/app-release.apk")
        if (!apkFile.exists()) {
            throw new GradleException("APK not found: ${apkFile.absolutePath}")
        }

        println "Deploying to system partition..."
        exec {
            executable 'adb'
            args 'push', apkFile.absolutePath, '/sdcard/EgyptianAgent-release.apk'
        }
        exec {
            executable 'adb'
            args 'shell', 'su', '-c', 'mkdir -p /system/priv-app/EgyptianAgent'
        }
        exec {
            executable 'adb'
            args 'shell', 'su', '-c', 'cp /sdcard/EgyptianAgent-release.apk /system/priv-app/EgyptianAgent/'
        }
        exec {
            executable 'adb'
            args 'shell', 'su', '-c', 'chmod 644 /system/priv-app/EgyptianAgent/EgyptianAgent-release.apk'
        }
        println "Deployment complete. Reboot device to activate."
    }
}

// Task for Honor X6c specific optimizations
tasks.register('applyHonorOptimizations') {
    description "Apply Honor X6c specific device optimizations"
    group "deployment"

    doLast {
        println "Applying Honor X6c optimizations..."
        // Disable battery optimization for the app
        exec {
            executable 'adb'
            args 'shell', 'dumpsys', 'deviceidle', 'whitelist', '+com.egyptian.agent'
        }
        // Allow background activity
        exec {
            executable 'adb'
            args 'shell', 'cmd', 'appops', 'set', 'com.egyptian.agent', 'RUN_IN_BACKGROUND', 'allow'
        }
        println "Optimizations applied."
    }
}