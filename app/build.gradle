plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.egyptian.agent'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.egyptian.agent"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName "${rootProject.ext.versionMajor}.${rootProject.ext.versionMinor}.${rootProject.ext.versionPatch}"

        // Critical for Honor X6c (MediaTek Helio G81 Ultra)
        // Native build configuration
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2 -ffast-math"
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_ARM_NEON=TRUE",
                          "-DANDROID_TOOLCHAIN=clang",
                          "-DUSE_LLAMA_CPP=OFF",
                          "-DUSE_WHISPER=OFF"
            }
        }

        // BuildConfig fields for FunctionGemma
        buildConfigField "boolean", "USE_FUNCTIONGEMMA", "true"
        buildConfigField "String", "MODEL_PATH", "\"/data/data/com.egyptian.agent/models/functiongemma-270m-it.gguf\""

        // Enable vector drawables
        vectorDrawables {
            useSupportLibrary true
        }

        // Set up resource configurations for Egyptian Arabic
        resConfigs "ar", "en"

        // Enable data binding and build config
        buildFeatures {
            dataBinding true
            buildConfig = true
            aidl = false
            renderScript = false
        }

        // NDK ABI filters - build only required ABIs
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Signing configurations
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // For production, use environment variables or secure storage
            // Example: storeFile file(System.getenv("KEYSTORE_PATH") ?: "../keystore/release.keystore")
            storeFile file('../keystore/release.keystore')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: "egyptian_agent"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Additional ProGuard optimization
            consumerProguardFiles 'proguard-rules.pro'
        }
        // Staging build type for pre-production testing
        staging {
            initWith debug
            debuggable true
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // JNI libraries configuration
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            java.srcDirs += ['src/main/cpp']
        }
        test {
            java.srcDirs += ['src/test/cpp']
        }
        // AI-specific source sets for FunctionGemma - commented out due to AGP compatibility
        // ai {
        //     java.srcDirs = ['src/ai/java', 'src/ai/kotlin']
        //     resources.srcDirs = ['src/ai/assets']
        // }
    }

    // CMake configuration for native libraries
    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Split APK by ABI to reduce size
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true  // Also build universal APK for testing
        }
    }

    // Optimize for Honor X6c performance
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    // Kotlin JVM target
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-opt-in=kotlin.RequiresOptIn']
    }

    // Resource optimization
    aaptOptions {
        cruncherEnabled = true
        cruncherProcesses = 4
        noCompress "tflite", "lite", "vosk", "bin", "pt", "gguf", "onnx"
    }

    // Packaging options
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
            excludes += ['META-INF/*.kotlin_module']
        }
        jniLibs {
            useLegacyPackaging = false
        }
        // Exclude duplicate native libraries for llama.cpp
        jniLibs {
            excludes += ['**/libllama.so']
        }
    }

    // Lint configuration
    lint {
        abortOnError false
        checkReleaseBuilds true
        disable 'MissingTranslation', 'ExtraTranslation'
        warning 'InvalidPackage'
    }

    // Test configuration
    testOptions {
        unitTests {
            includeAndroidResources = true  // Enable Robolectric
            returnDefaultValues = true
            all {
                useJUnitPlatform()  // Enable JUnit 5
                testLogging {
                    events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
                    exceptionFormat 'full'
                    showCauses true
                    showExceptions true
                    showStackTraces true
                    showStandardStreams true
                }
                // Set max heap size for tests
                maxHeapSize = '2g'
                // Enable parallel execution
                maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
                // Fail fast option
                failFast = false
                // Enable coverage
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // Build features for AI modules
    buildFeatures {
        aidl = false
        renderScript = false
    }
}

// ===========================================
// JaCoCo Code Coverage Configuration
// ===========================================
apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.12'
    reportsDirectory = layout.buildDirectory.dir('reports/jacoco')
}

tasks.withType(Test).configureEach {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

// Task to generate combined code coverage report
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest', 'createDebugUnitTestCoverageReport'
    
    group = 'Reporting'
    description = 'Generate JaCoCo code coverage report for unit tests'
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
        xml.destination = file("${buildDir}/reports/jacoco/test/jacocoTestReport.xml")
        html.destination = file("${buildDir}/reports/jacoco/test/html")
    }
    
    // Source directories
    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/*Lambda*.*',
        '**/*Builder.*',
        '**/*Binding.*',
        '**/*Module.*',
        '**/*Factory.*',
        '**/*_MembersInjector.*',
        '**/*_Impl.*',
        '**/*_Provide*Factory*.*',
        '**/*Companion.*',
        '**/*$Result.*',
        '**/*$WhenMappings.*'
    ]
    
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def kotlinDebugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    
    sourceDirectories.from = files([
        "${projectDir}/src/main/java",
        "${projectDir}/src/main/kotlin"
    ])
    
    classDirectories.from = files([debugTree, kotlinDebugTree])
    
    executionData.from = fileTree(dir: project.buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'jacoco/test.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
        'outputs/code_coverage/debugAndroidTest/connected/**.ec'
    ])
    
    doLast {
        println "Coverage report generated at: ${reports.html.destination}"
    }
}

// Task to generate Android test coverage
tasks.register('jacocoAndroidTestReport', JacocoReport) {
    dependsOn 'connectedDebugAndroidTest'
    
    group = 'Reporting'
    description = 'Generate JaCoCo code coverage report for Android tests'
    
    reports {
        xml.required = true
        html.required = true
        xml.destination = file("${buildDir}/reports/jacoco/androidTest/jacocoAndroidTestReport.xml")
        html.destination = file("${buildDir}/reports/jacoco/androidTest/html")
    }
    
    def fileFilter = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
        '**/*Test*.*', 'android/**/*.*'
    ]
    
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def kotlinDebugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    
    sourceDirectories.from = files(["${projectDir}/src/main/java", "${projectDir}/src/main/kotlin"])
    classDirectories.from = files([debugTree, kotlinDebugTree])
    executionData.from = fileTree(dir: project.buildDir, includes: [
        'outputs/code_coverage/debugAndroidTest/connected/**.ec'
    ])
}

// Combined coverage task
tasks.register('jacocoFullReport', JacocoReport) {
    dependsOn 'testDebugUnitTest', 'connectedDebugAndroidTest'
    
    group = 'Reporting'
    description = 'Generate combined JaCoCo coverage report'
    
    reports {
        xml.required = true
        html.required = true
        xml.destination = file("${buildDir}/reports/jacoco/full/jacocoFullReport.xml")
        html.destination = file("${buildDir}/reports/jacoco/full/html")
    }
    
    def fileFilter = [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
        '**/*Test*.*', 'android/**/*.*'
    ]
    
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def kotlinDebugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    
    sourceDirectories.from = files(["${projectDir}/src/main/java", "${projectDir}/src/main/kotlin"])
    classDirectories.from = files([debugTree, kotlinDebugTree])
    executionData.from = fileTree(dir: project.buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
        'outputs/code_coverage/debugAndroidTest/connected/**.ec'
    ])
}

// Coverage verification task with thresholds
tasks.register('jacocoCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'testDebugUnitTest'
    
    group = 'Verification'
    description = 'Verify code coverage meets minimum thresholds'
    
    violationRules {
        rule {
            limit {
                minimum = 0.80  // 80% minimum coverage
            }
        }
        rule {
            enabled = true
            element = 'CLASS'
            includes = ['com.egyptian.agent.nlu.*', 'com.egyptian.agent.executor.*']
            
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90  // 90% for critical classes
            }
        }
    }
    
    executionData.from = fileTree(dir: project.buildDir, includes: [
        'jacoco/testDebugUnitTest.exec',
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    ])
}

