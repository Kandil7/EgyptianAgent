# Check Email Workflow - اقرا الايميل
# Checks Gmail inbox for new emails
appId: com.google.android.gm
name: Check Email
nameAr: اقرا الايميل
description: Check Gmail inbox for new emails
descriptionAr: فحص صندوق الوارد في جي ميل
---
- launchApp: com.google.android.gm
