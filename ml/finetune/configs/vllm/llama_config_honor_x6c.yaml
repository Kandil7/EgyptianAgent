# Llama 3.2 3B Configuration for Honor X6c
# Target Device: Honor X6c (MediaTek Helio G81 Ultra, 6GB RAM)
# Model: llama-3.2-3b-Q4_K_M.gguf (~1.64GB)

# =============================================================================
# HARDWARE SPECIFICATIONS (Honor X6c)
# =============================================================================
# SoC: MediaTek Helio G81 Ultra
# CPU: Octa-core (2x Cortex-A75 @ 2.0 GHz + 6x Cortex-A55 @ 1.8 GHz)
# GPU: Mali-G52 MC2
# RAM: 6GB LPDDR4X
# Storage: 128GB eMMC 5.1
# Android: 14 (MagicOS 8.0)

# =============================================================================
# MODEL SPECIFICATIONS
# =============================================================================
# Model: Llama 3.2 3B Instruct
# Quantization: Q4_K_M (4-bit K-quants Medium)
# Model Size: ~1.64GB (GGUF format)
# Parameters: 3.2 billion
# Context Window: 128K (we use 2048 for mobile)
# Vocabulary: 128K tokens (supports Arabic)

# =============================================================================
# MEMORY BUDGET
# =============================================================================
# Model File: 1.64GB (memory-mapped, not fully loaded)
# KV Cache: ~100MB (2048 context, 32 layers)
# Runtime Overhead: ~200MB
# Total Peak RAM: ~2.0-2.5GB
# Available on 6GB device: ~3-4GB (after Android)
# Safety Margin: ~500MB

# =============================================================================
# PERFORMANCE TARGETS
# =============================================================================
# Model Load Time (cold): <30 seconds
# Model Load Time (warm): <5 seconds
# Token Generation Speed: 8-12 tokens/second
# Time to First Token: <500ms
# 128 Token Response: <1.5 seconds (target)
# Memory Usage: <350MB during inference

# =============================================================================
# NATIVE CONFIGURATION (llama.cpp)
# =============================================================================

# Context Parameters
n_ctx = 2048              # Context window (balance quality vs memory)
n_batch = 512             # Batch size for prompt processing
n_ubatch = 512            # Micro-batch size
n_threads = 4             # CPU threads (optimal for Helio G81)
n_threads_batch = 4       # Threads for batch processing

# Memory Optimization
use_mmap = true           # Memory map model (reduces RAM usage)
use_mlock = false         # Don't lock memory (allow swapping)
numa = false              # Disable NUMA (mobile doesn't have it)

# GPU Offloading (disabled for compatibility)
n_gpu_layers = 0          # CPU only (Mali-G52 not well supported)

# =============================================================================
# SAMPLING PARAMETERS (Egyptian Arabic Optimized)
# =============================================================================

# Temperature and Sampling
temperature = 0.7         # Balance creativity and consistency
top_k = 40                # Sample from top 40 tokens
top_p = 0.9               # Nucleus sampling (90% probability mass)
min_p = 0.0               # Minimum probability threshold

# Penalties
repeat_penalty = 1.1      # Reduce repetition (important for Arabic)
repeat_last_n = 64        # Look back 64 tokens for repetition
frequency_penalty = 0.0   # Frequency penalty (disabled)
presence_penalty = 0.0    # Presence penalty (disabled)

# Special Tokens
n_keep = 48               # Keep special tokens (bos, eos, etc.)
special = true            # Parse special tokens

# =============================================================================
# EGYPTIAN ARABIC PROMPT TEMPLATES
# =============================================================================

# System Prompt (Egyptian Arabic)
system_prompt = """
أنت مساعد صوتي مصري بتتكلم مصري عامي طبيعي.
رد بإيجاز وبطريقة ودية وطبيعية زي المصريين.
استخدم اللهجة المصرية في ردك.
كون مفيد ومباشر في ردك.
"""

# Conversation Format
conversation_template = """
{system}

تاريخ المحادثة:
{history}

المستخدم: {user_query}
المساعد:
"""

# Classification Prompt (for NLU)
classification_prompt = """
أنت مصنف نوايا لمساعد صوتي مصري.
صنف الأمر ده لواحد من الأنواع دي:
CALL_CONTACT, SEND_WHATSAPP, SET_ALARM, READ_TIME, EMERGENCY, GREETING, UNKNOWN

اكتب الرد في شكل JSON:
{
  "intent": "نوع الأمر",
  "entities": {
    "contact": "اسم جهة الاتصال",
    "time": "الوقت"
  },
  "confidence": 0.95
}

الأمر: "{user_input}"
الرد:
"""

# =============================================================================
# INTENT TYPES (EgyptianAgent)
# =============================================================================
# CALL_CONTACT      - اتصل بـ / كلم / رن على
# SEND_WHATSAPP     - ابعت واتساب / قول لـ
# SEND_VOICE_MESSAGE - ابعت رسالة صوتية
# SET_ALARM         - نبهني / ذكرني / اضبط المنبه
# READ_TIME         - الساعة كام / قوللي الوقت
# READ_MISSED_CALLS - اقرأ المكالمات الفائتة
# TOGGLE_WIFI       - شغل / اطفي الواي فاي
# TOGGLE_BLUETOOTH  - شغل / اطفي البلوتوث
# OPEN_APP          - افتح [تطبيق]
# EMERGENCY         - نجدة / استغاثة
# SENIOR_ASSIST     - مساعدة كبار السن
# GREETING          - أهلاً / ازيك / عامل ايه
# THANK_YOU         - شكراً / يسلمو
# GOODBYE           - مع السلامة / باي
# UNKNOWN           - غير معروف

